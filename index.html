<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moedas da Sabedoria — Jogo de Educação Financeira</title>
<meta name="author" content="Kauan Gouveia Cipullo">
<meta name="description" content="Jogo de educação financeira — Projeto de Extensão Curricular (UniSanta, ADS)">
<style>
  @font-face { font-family: 'Pixel'; src: url('assets/fonts/pixel.woff2') format('woff2'); font-display: block; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b1a24; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: Pixel, monospace; }
  #wrap { --u: calc(min(100vw, calc(100vh * 480 / 272)) / 480); position: relative; width: calc(480 * var(--u)); height: calc(272 * var(--u)); }
  canvas#game { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #12303b; }
  .top { position: absolute; left: 50%; top: calc(4 * var(--u)); transform: translateX(-50%); display: flex; flex-direction: row; gap: calc(4 * var(--u)); z-index: 5; }
  .top button { width: calc(20 * var(--u)); height: calc(20 * var(--u)); font: calc(10 * var(--u)) Pixel, monospace; line-height: 1; color: #fff4d6; background: rgba(18,48,59,.85); border: calc(1.5 * var(--u)) solid #1f8a86; padding: 0; cursor: pointer; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
  body.hidebtn .top { display: none; }
  .top button:hover { background: #1f8a86; }
  #touch { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 0; z-index: 6; pointer-events: none; }
  body.touch #touch { display: block; }
  #touch button { pointer-events: auto; position: fixed; bottom: 14px; width: 74px; height: 74px; border-radius: 50%; border: 3px solid rgba(255,244,214,.8); background: rgba(18,48,59,.55); color: #fff4d6; font: 16px Pixel, monospace; touch-action: none; }
  #touch button.on { background: rgba(255,210,63,.6); color: #2b1b00; }
  #btnLeft { left: 12px; } #btnRight { left: 100px; } #btnAct { right: 12px; width: 78px; height: 78px; font: 18px Pixel, monospace; }
  #btnEbook { display: none; position: absolute; left: 50%; bottom: calc(6 * var(--u)); transform: translateX(-50%); z-index: 7; font: calc(8 * var(--u)) Pixel, monospace; color: #2b1b00; background: #ffd23f; border: calc(1.5 * var(--u)) solid #fff4d6; padding: calc(4 * var(--u)) calc(9 * var(--u)); cursor: pointer; white-space: nowrap; text-decoration: none; box-shadow: 0 0 0 calc(1.5 * var(--u)) #12303b; }
  #btnEbook.show { display: block; }
  #btnEbook:hover { background: #fff4d6; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="272" aria-label="Moedas da Sabedoria"></canvas>
<div class="top"><button id="btnMute" aria-label="Som">🔊</button><button id="btnFull" aria-label="Tela cheia">⛶</button></div>
<a id="btnEbook" href="assets/ebook.pdf" download="Moedas-da-Sabedoria-Ebook.pdf">📘 BAIXAR E-BOOK GRÁTIS</a></div>
<div id="touch">
  <button id="btnLeft">&lt;</button><button id="btnRight">&gt;</button>
  <button id="btnAct">A</button>
</div>
<script src="js/config.js"></script>
<script src="js/levels.js"></script>
<script src="js/sfx-data.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/world.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
